name: marks-predictor

on:
  push:
    branches: [main, master]
    paths:
      - "marks-predictor/**"
      - ".github/workflows/marks-predictor.yml"
      - ".github/workflows/_predictor-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_predictor-deploy.yml
    with:
      service_name: marks-predictor
      aws_region: ap-south-1
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

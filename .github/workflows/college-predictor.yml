name: college-predictor

on:
  push:
    branches: [main, master]
    paths:
      - "college-predictor/**"
      - ".github/workflows/college-predictor.yml"
      - ".github/workflows/_predictor-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_predictor-deploy.yml
    with:
      service_name: college-predictor
      aws_region: ap-south-1
      # College Lambda was provisioned as x86_64; arm64 images cause immediate 502.
      # After `terraform apply` with architecture = "arm64", switch this to linux/arm64.
      platform: linux/amd64
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
